name: release

# Deliberate, dispatch-only publishing to PyPI. No tag trigger: the
# repo-topology cut tags v0.1.0 on the dev repo and must not auto-publish.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm the PyPI upload'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build the sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI (trusted publishing)
        run: uv publish --trusted-publishing always dist/*

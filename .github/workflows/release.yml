name: release

# Deliberate, dispatch-only publishing to TestPyPI. No tag trigger: the
# repo-topology cut tags v0.1.0 on the dev repo and must not auto-publish.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm the TestPyPI upload'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build the sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # No stored secret: trusted publishing exchanges the job's OIDC token
      # (id-token: write, above) for a short-lived upload token. This only
      # works once test.pypi.org has a registered "trusted publisher" for
      # this repo/workflow/environment (a one-time, RC-time manual step).
      - name: Publish to TestPyPI (trusted publishing)
        run: uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always dist/*
